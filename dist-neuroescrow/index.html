<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NeuroEscrow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1>NeuroEscrow</h1>
                <div class="user-info">
                    <span id="user-name">Загрузка...</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main" id="main-content">
            <!-- Views will be rendered here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="hermes" onclick="app.navigate('hermes')">
                <span class="nav-icon">🎙️</span>
                <span class="nav-label">Гермес</span>
            </button>
            <button class="nav-btn" data-view="deals" onclick="app.navigate('deals')">
                <span class="nav-icon">🤝</span>
                <span class="nav-label">Сделки</span>
            </button>
            <button class="nav-btn" data-view="profile" onclick="app.navigate('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="js/telegram.js"></script>
    <script src="js/tonconnect.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

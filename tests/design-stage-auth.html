<!DOCTYPE html>
<html lang="ru" data-reduced-motion="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth Sheet — дизайн-стенд</title>

<!-- Реальные стили проекта: стенд не может разойтись с продом -->
<link rel="stylesheet" href="../css/_variables.css">
<link rel="stylesheet" href="../css/_auth-sheet.css">

<style>
  /* Только обвязка стенда. На саму шторку не влияет. */
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 22% 28%, #1b2440 0%, transparent 55%),
      radial-gradient(circle at 78% 72%, #221a3a 0%, transparent 55%),
      #06070d;
    color: #e2e8f0;
  }
  /* Имитация голограммы под шторкой — чтобы видеть, как работает blur */
  .stage-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(90deg, rgba(120,180,255,.10) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(0deg, rgba(255,120,200,.07) 0 2px, transparent 2px 26px);
  }
  .stage-bg::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 42vmin; height: 42vmin; transform: translate(-50%,-50%);
    border-radius: 50%;
    background: conic-gradient(from 0deg, #7c5cff, #2aabee, #34a853, #fbbc05, #ea4335, #7c5cff);
    filter: blur(48px); opacity: .45;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9000;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 14px;
    background: rgba(8,10,18,.92);
    border-bottom: 1px solid rgba(255,255,255,.08);
    font-size: 13px;
  }
  .toolbar strong { margin-right: 6px; font-weight: 600; letter-spacing: .02em; }
  .toolbar button {
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,.06); color: #e2e8f0;
    border: 1px solid rgba(255,255,255,.14); font-size: 12.5px;
  }
  .toolbar button:hover { background: rgba(255,255,255,.12); }
  .toolbar .sep { width: 1px; height: 20px; background: rgba(255,255,255,.14); }
</style>
</head>
<body>
<div class="stage-bg"></div>

<div class="toolbar">
  <strong>Состояния:</strong>
  <button data-case="fresh">Новый пользователь</button>
  <button data-case="returning">Возвратник</button>
  <button data-case="gsi-down">Google недоступен</button>
  <button data-case="telegram">Внутри Telegram</button>
  <span class="sep"></span>
  <button data-motion="toggle">reduced-motion: off</button>
  <button data-case="close">Закрыть</button>
</div>

<script type="module">
import {
  showAuthSheet, closeAuthSheet, rememberUser, forgetUser,
} from '../js/ui/unifiedAuthSheet.js';

const CONSENT = 'Продолжая, вы принимаете <a href="#">условия</a> и <a href="#">политику конфиденциальности</a>.';
const noop = (name) => () => console.log('[stage] click:', name);

function open(kind) {
  closeAuthSheet();

  if (kind === 'returning') {
    rememberUser({ first_name: 'Александр', email: 'neurocoderz@gmail.com', platform: 'google' });
  } else {
    forgetUser();
  }

  const handlers = {
    onGoogle: noop('google'),
    onTelegram: noop('telegram'),
    onGuest: noop('guest'),
    onContinue: noop('continue'),
    consentHTML: CONSENT,
  };

  if (kind === 'telegram') {
    handlers.telegramLabel = 'Продолжить как Александр';
    delete handlers.onGoogle;
  }

  // Имитируем настоящую GIS-кнопку, кроме сценария падения Google
  if (kind !== 'gsi-down' && kind !== 'telegram') {
    handlers.renderGis = (slot) => {
      const b = document.createElement('div');
      b.style.cssText =
        'height:44px;width:100%;max-width:320px;border-radius:10px;background:#fff;color:#3c4043;' +
        'display:flex;align-items:center;justify-content:center;gap:10px;font:500 14px Roboto,system-ui;' +
        'box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer';
      b.innerHTML =
        '<svg width="18" height="18" viewBox="0 0 24 24">' +
        '<path fill="#4285f4" d="M22.6 12.2c0-.8-.1-1.4-.2-2.1H12v4h6c-.1 1-.8 2.5-2.2 3.5l3.4 2.6c2-1.8 3.4-4.5 3.4-8z"/>' +
        '<path fill="#34a853" d="M12 23c2.9 0 5.3-1 7.1-2.6l-3.4-2.6c-.9.6-2.1 1-3.7 1-2.8 0-5.2-1.9-6.1-4.4l-3.5 2.7C4.2 20.5 7.8 23 12 23z"/>' +
        '<path fill="#fbbc05" d="M5.9 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4L2.4 7C1.7 8.5 1.3 10.2 1.3 12s.4 3.5 1.1 5l3.5-2.6z"/>' +
        '<path fill="#ea4335" d="M12 5.4c2 0 3.3.8 4.1 1.6l3-2.9C17.3 2.4 14.9 1.3 12 1.3 7.8 1.3 4.2 3.8 2.4 7l3.5 2.7C6.8 7.2 9.2 5.4 12 5.4z"/></svg>' +
        '<span>Войти через Google</span>';
      slot.appendChild(b);
    };
  }

  const api = showAuthSheet(handlers);
  if (kind === 'gsi-down') api.highlightTelegram();
  window.__sheet = api;
}

document.querySelector('.toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.motion) {
    const html = document.documentElement;
    const on = html.getAttribute('data-reduced-motion') === 'true';
    html.setAttribute('data-reduced-motion', String(!on));
    btn.textContent = `reduced-motion: ${!on ? 'on' : 'off'}`;
    return;
  }
  if (btn.dataset.case === 'close') { closeAuthSheet(); return; }
  open(btn.dataset.case);
});

open('fresh');
</script>
</body>
</html>

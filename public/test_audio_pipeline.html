<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BasilaQ-128 Audio Pipeline — Standalone Test</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    h1 { color: #0f0; }
    #log { background: #000; padding: 10px; border: 1px solid #333; 
           max-height: 600px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; }
    button { padding: 10px 20px; margin: 5px; background: #333; color: #0f0; 
             border: 1px solid #0f0; cursor: pointer; font-family: monospace; }
    button:hover { background: #0f0; color: #000; }
    input[type="file"] { margin: 10px 0; }
    table { border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #555; padding: 4px 8px; font-size: 12px; }
    th { background: #333; color: #0f0; }
    td.db { text-align: right; }
    .pass { color: #0f0; } .fail { color: #f00; } .warn { color: #ff0; }
  </style>
</head>
<body>
<h1>🔊 BasilaQ-128 Pipeline Test</h1>
<p>Автономный тест аудио-тракта: AudioFile → WASM CWT → Выходные данные</p>

<input type="file" id="audioFile" accept="audio/*">
<button id="btnTest" disabled>▶ Запустить тест</button>
<div id="log">Ожидание файла...</div>

<script>
const log = document.getElementById('log');
let audioCtx, audioBuffer, workletNode;

function logMsg(msg, cls = '') {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

document.getElementById('audioFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  logMsg(`📂 Файл: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`, 'pass');
  
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    const arrayBuf = await file.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    
    logMsg(`✅ Декодировано: ${audioBuffer.duration.toFixed(2)} сек, ` +
           `${audioBuffer.numberOfChannels} канал(ов), ${audioBuffer.sampleRate} Гц`, 'pass');
    
    // Статистика сэмплов
    const ch0 = audioBuffer.getChannelData(0);
    const ch1 = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : ch0;
    let rms0 = 0, rms1 = 0, peak0 = 0, peak1 = 0;
    for (let i = 0; i < ch0.length; i++) {
      rms0 += ch0[i] * ch0[i];
      if (Math.abs(ch0[i]) > peak0) peak0 = Math.abs(ch0[i]);
    }
    for (let i = 0; i < ch1.length; i++) {
      rms1 += ch1[i] * ch1[i];
      if (Math.abs(ch1[i]) > peak1) peak1 = Math.abs(ch1[i]);
    }
    rms0 = Math.sqrt(rms0 / ch0.length);
    rms1 = Math.sqrt(rms1 / ch1.length);
    
    logMsg(`📊 Сигнал (L): RMS=${rms0.toFixed(6)} (${(20*Math.log10(rms0+1e-10)).toFixed(1)} dBFS), Peak=${peak0.toFixed(6)}`, rms0 > 0.01 ? 'pass' : 'fail');
    logMsg(`📊 Сигнал (R): RMS=${rms1.toFixed(6)} (${(20*Math.log10(rms1+1e-10)).toFixed(1)} dBFS), Peak=${peak1.toFixed(6)}`, rms1 > 0.01 ? 'pass' : 'fail');
    
    document.getElementById('btnTest').disabled = false;
  } catch (err) {
    logMsg(`❌ Ошибка декодирования: ${err.message}`, 'fail');
  }
});

document.getElementById('btnTest').addEventListener('click', async () => {
  logMsg('\n🧪 Запуск теста...', 'pass');
  
  // 1. Загрузить WASM напрямую
  logMsg('1️⃣ Загрузка WASM...');
  try {
    const wasmResp = await fetch('/wasm/cwt_analyzer.wasm');
    const wasmBuf = await wasmResp.arrayBuffer();
    logMsg(`   Размер: ${wasmBuf.byteLength} байт`, wasmBuf.byteLength > 10000 ? 'pass' : 'fail');
    
    const { instance } = await WebAssembly.instantiate(wasmBuf, {
      env: {
        abort: () => console.log('WASM ABORT'),
        malloc: (size) => wasmExports.malloc(size),
        free: (ptr, size) => wasmExports.free(ptr, size)
      }
    });
    const wasmExports = instance.exports;
    
    // Проверка экспортов
    const needed = ['cwtanalyzer_new', 'cwtanalyzer_process', 'malloc', 'free'];
    for (const fn of needed) {
      logMsg(`   ${fn}: ${wasmExports[fn] ? '✅' : '❌'}`, wasmExports[fn] ? 'pass' : 'fail');
    }
    
    // Создать анализатор (60 FPS, file source=0)
    const analyzerPtr = wasmExports.cwtanalyzer_new(48000, 60, 0);
    logMsg(`   analyzerPtr: ${analyzerPtr}`, analyzerPtr > 0 ? 'pass' : 'fail');
    
    // Выделить буферы
    const bufLeft = wasmExports.malloc(128 * 4);
    const bufRight = wasmExports.malloc(128 * 4);
    const bufLevels = wasmExports.malloc(256 * 4);
    const bufPans = wasmExports.malloc(128 * 4);
    const bufConf = wasmExports.malloc(128 * 4);
    logMsg(`   Буферы выделены: L=${bufLeft}, R=${bufRight}, Levels=${bufLevels}, Pans=${bufPans}`, 'pass');
    
    const mem = new Float32Array(wasmExports.memory.buffer);
    
    // 2. Подготовить тестовые данные (60 FPS = 800 сэмплов на кадр)
    const samplesPerFrame = 800;
    const totalSamples = Math.min(audioBuffer.length, samplesPerFrame * 10); // Первые 10 кадров = 167мс
    const ch0 = audioBuffer.getChannelData(0);
    const ch1 = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : ch0;
    
    logMsg(`\n2️⃣ Симуляция CWT (${Math.floor(totalSamples/samplesPerFrame)} кадров):`);
    
    let frameIdx = 0;
    let offset = 0;
    
    while (offset + samplesPerFrame <= totalSamples) {
      const chunkL = ch0.subarray(offset, offset + samplesPerFrame);
      const chunkR = ch1.subarray(offset, offset + samplesPerFrame);
      
      // Вычислить RMS входного сигнала
      let rmsIn = 0;
      for (let i = 0; i < chunkL.length; i++) rmsIn += chunkL[i] * chunkL[i];
      rmsIn = Math.sqrt(rmsIn / chunkL.length);
      
      // Копировать в WASM память
      mem.set(chunkL, bufLeft / 4);
      mem.set(chunkR, bufRight / 4);
      
      // Вызвать WASM
      wasmExports.cwtanalyzer_process(
        analyzerPtr,
        bufLeft, chunkL.length,
        bufRight, chunkR.length,
        bufLevels, 256,
        bufPans, 128,
        bufConf, 128
      );
      
      // Прочитать результаты
      const levels = new Float32Array(wasmExports.memory.buffer, bufLevels, 256);
      const pans = new Float32Array(wasmExports.memory.buffer, bufPans, 128);
      const conf = new Float32Array(wasmExports.memory.buffer, bufConf, 128);
      
      const minDb = Math.min(...Array.from(levels));
      const maxDb = Math.max(...Array.from(levels));
      const avgDb = Array.from(levels).reduce((a,b) => a+b, 0) / levels.length;
      const isInteger = levels.every(v => v === Math.round(v));
      
      logMsg(`   Кадр ${frameIdx}: inRMS=${rmsIn.toFixed(6)} (${(20*Math.log10(rmsIn+1e-10)).toFixed(1)} dBFS) | ` +
             `dB [${minDb.toFixed(1)}, ${maxDb.toFixed(1)}] avg=${avgDb.toFixed(1)} | ` +
             `pan [${Math.min(...Array.from(pans)).toFixed(3)}, ${Math.max(...Array.from(pans)).toFixed(3)}] | ` +
             `conf max=${Math.max(...Array.from(conf)).toFixed(3)} | ` +
             `целые=${isInteger ? '✅' : '❌'}`,
             maxDb > -30 ? 'pass' : (maxDb > -80 ? 'warn' : 'fail'));
      
      // Таблица первых 8 полутонов для первого кадра
      if (frameIdx === 0) {
        let table = '<table><tr><th>Bin</th><th>Нота</th><th>Гц</th><th>dB L</th><th>dB R</th><th>Pan</th><th>Conf</th></tr>';
        const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        for (let i = 0; i < 8; i++) {
          const octave = Math.floor(i / 12);
          const noteName = notes[i % 12] + octave;
          const freq = (16.352 * Math.pow(2, i/12)).toFixed(1);
          table += `<tr><td>${i}</td><td>${noteName}</td><td>${freq}</td><td class="db">${levels[i].toFixed(1)}</td><td class="db">${levels[i+128].toFixed(1)}</td><td>${pans[i].toFixed(3)}</td><td>${conf[i].toFixed(3)}</td></tr>`;
        }
        table += '</table>';
        log.innerHTML += table;
      }
      
      frameIdx++;
      offset += samplesPerFrame;
    }
    
    logMsg(`\n✅ Тест завершён! Обработано ${frameIdx} кадров.`, 'pass');
    
    // Вердикт
    if (maxDb > -30) {
      logMsg('🎉 WASM получает РЕАЛЬНЫЙ сигнал! Проблема НЕ во входных данных.', 'pass');
    } else if (maxDb > -80) {
      logMsg('⚠️ WASM получает ОЧЕНЬ ТИХИЙ сигнал. Проблема в маршрутизации AudioNode.', 'warn');
    } else {
      logMsg('❌ WASM получает ТИШИНУ. AudioNode цепочка разорвана!', 'fail');
    }
    
    if (!isInteger) {
      logMsg('⚠️ dB значения НЕ целочисленные. WASM нужно пересобрать с .round()', 'warn');
    } else {
      logMsg('✅ dB значения целочисленные.', 'pass');
    }
    
    wasmExports.cwtanalyzer_free(analyzerPtr);
    
  } catch (err) {
    logMsg(`❌ Ошибка WASM: ${err.message}`, 'fail');
    console.error(err);
  }
});
</script>
</body>
</html>

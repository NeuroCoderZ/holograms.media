name: 🚀 Deploy Frontend to Cloudflare Pages (Multi-Branch)

on:
  push:
    branches: [main, develop, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Determine Environment
        id: env
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}" >> $GITHUB_OUTPUT
            echo "CLIENT_SECRET=${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=holograms.media" >> $GITHUB_OUTPUT
            echo "ENV_FILE=.env.production" >> $GITHUB_OUTPUT
          elif [[ ${{ github.ref }} == 'refs/heads/develop' ]]; then
            echo "ENVIRONMENT=development" >> $GITHUB_OUTPUT
            echo "CLIENT_ID=${{ secrets.DEV_GOOGLE_CLIENT_ID }}" >> $GITHUB_OUTPUT
            echo "CLIENT_SECRET=${{ secrets.DEV_GOOGLE_CLIENT_SECRET }}" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=dev.holograms.media" >> $GITHUB_OUTPUT
            echo "ENV_FILE=.env.development" >> $GITHUB_OUTPUT
          else
            # For master branch, default to production
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}" >> $GITHUB_OUTPUT
            echo "CLIENT_SECRET=${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=holograms.media" >> $GITHUB_OUTPUT
            echo "ENV_FILE=.env.production" >> $GITHUB_OUTPUT
          fi

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔧 Create Environment File
        run: |
          cat > .env.${{ steps.env.outputs.ENVIRONMENT }} << EOF
          VITE_GOOGLE_CLIENT_ID=${{ steps.env.outputs.CLIENT_ID }}
          VITE_API_URL=https://${{ steps.env.outputs.DEPLOY_URL }}
          VITE_ENVIRONMENT=${{ steps.env.outputs.ENVIRONMENT }}
          VITE_AUTH_REDIRECT_URI=https://${{ steps.env.outputs.DEPLOY_URL }}/auth/google/callback
          VITE_SIGNALING_URL=/ws/signaling
          EOF
          cat .env.${{ steps.env.outputs.ENVIRONMENT }}

      - name: 🏗️ Build Frontend
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ steps.env.outputs.CLIENT_ID }}
          VITE_API_URL: https://${{ steps.env.outputs.DEPLOY_URL }}
          VITE_ENVIRONMENT: ${{ steps.env.outputs.ENVIRONMENT }}
          VITE_AUTH_REDIRECT_URI: https://${{ steps.env.outputs.DEPLOY_URL }}/auth/google/callback

      - name: 🔧 Copy Assets to dist
        run: |
          cp public/_headers dist/_headers
          cp public/_redirects dist/_redirects
          ls -R dist

      - name: ☁️ Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: holograms-media
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Log Deployment Info
        run: |
          echo "✅ Deployment completed!"
          echo "Environment: ${{ steps.env.outputs.ENVIRONMENT }}"
          echo "Deploy URL: https://${{ steps.env.outputs.DEPLOY_URL }}"
          echo "Google Client ID: ${{ steps.env.outputs.CLIENT_ID }}"

name: 'Sync Knowledge Base'

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Prevents multiple simultaneous syncs and cancels outdated runs
concurrency:
  group: sync-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: 'Checkout code'
      uses: actions/checkout@v4

    - name: 'Set up Python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 'Set up Node.js'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 'Install Python Dependencies'
      run: pip install -r requirements.txt
        
    - name: '1. Generate Context'
      run: npx repomix
      
    - name: '2. Sanitize Context'
      run: python scripts/sanitize_repo.py
      
    - name: '3. Sync Vector DB (Holograms.Media)'
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
        ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DATABASE_URL }}
        ASTRA_DB_KEYSPACE: ${{ secrets.ASTRA_DB_KEYSPACE || 'default_keyspace' }}
      run: python scripts/sync_knowledge_base.py
    
    - name: '4. Sync NeuroEscrow Knowledge Base'
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
        ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DATABASE_URL }}
      run: |
        npm install dotenv
        cd neuroescrow
        npx repomix
        cd ..
        node scripts/index-hermes.js

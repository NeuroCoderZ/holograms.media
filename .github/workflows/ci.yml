name: CI

on:
  push:
    branches: [master, prod]
  pull_request:
    branches: [master, prod]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install npm deps
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Node smoke
        run: node -e 'console.log("ci ok")'

  deploy_stub:
    runs-on: ubuntu-latest
    needs: smoke
    if: false # enable when ready
    steps:
      - name: Deploy to Cloudflare Workers (stub)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }} # provide via repository secrets
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Deployment would run here. Ensure CF_API_TOKEN and CF_ACCOUNT_ID are set in repo secrets."

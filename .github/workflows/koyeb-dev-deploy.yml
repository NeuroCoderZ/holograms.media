name: 🧪 Deploy Backend to Koyeb (Development)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  deploy_backend_dev:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install and Configure Koyeb CLI
        uses: koyeb-community/install-koyeb-cli@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: 🚀 Deploy and Sync Environment
        run: |
          # Sync secrets to Vault (DEV versions)
          koyeb secret update DEV_GOOGLE_CLIENT_ID --value "${{ secrets.DEV_GOOGLE_CLIENT_ID }}" || koyeb secret create DEV_GOOGLE_CLIENT_ID --value "${{ secrets.DEV_GOOGLE_CLIENT_ID }}"
          koyeb secret update DEV_GOOGLE_CLIENT_SECRET --value "${{ secrets.DEV_GOOGLE_CLIENT_SECRET }}" || koyeb secret create DEV_GOOGLE_CLIENT_SECRET --value "${{ secrets.DEV_GOOGLE_CLIENT_SECRET }}"
          koyeb secret update ASTRA_DB_APPLICATION_TOKEN --value "${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}" || koyeb secret create ASTRA_DB_APPLICATION_TOKEN --value "${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}"
          koyeb secret update ASTRA_DB_API_ENDPOINT --value "${{ secrets.ASTRA_DATABASE_URL }}" || koyeb secret create ASTRA_DB_API_ENDPOINT --value "${{ secrets.ASTRA_DATABASE_URL }}"
          koyeb secret update GOOGLE_API_KEY --value "${{ secrets.GOOGLE_API_KEY }}" || koyeb secret create GOOGLE_API_KEY --value "${{ secrets.GOOGLE_API_KEY }}"
          koyeb secret update MISTRAL_API_KEY --value "${{ secrets.MISTRAL_API_KEY }}" || koyeb secret create MISTRAL_API_KEY --value "${{ secrets.MISTRAL_API_KEY }}"
          koyeb secret update OPENCLAW_GATEWAY_TOKEN --value "${{ secrets.OPENCLAW_GATEWAY_TOKEN }}" || koyeb secret create OPENCLAW_GATEWAY_TOKEN --value "${{ secrets.OPENCLAW_GATEWAY_TOKEN }}"

          # Update Development Service
          koyeb service update holograms-media-dev/holograms-media-dev \
            --git-branch dev \
            --git-builder docker \
            --git-docker-dockerfile Dockerfile \
            --env ENVIRONMENT=development \
            --env GOOGLE_CLIENT_ID={{ secret.DEV_GOOGLE_CLIENT_ID }} \
            --env GOOGLE_CLIENT_SECRET={{ secret.DEV_GOOGLE_CLIENT_SECRET }} \
            --env ASTRA_DB_APPLICATION_TOKEN={{ secret.ASTRA_DB_APPLICATION_TOKEN }} \
            --env ASTRA_DB_API_ENDPOINT={{ secret.ASTRA_DB_API_ENDPOINT }} \
            --env ASTRA_DATABASE_URL={{ secret.ASTRA_DB_API_ENDPOINT }} \
            --env ASTRA_DB_KEYSPACE=default_keyspace \
            --env GOOGLE_API_KEY={{ secret.GOOGLE_API_KEY }} \
            --env MISTRAL_API_KEY={{ secret.MISTRAL_API_KEY }} \
            --env OPENCLAW_GATEWAY_TOKEN={{ secret.OPENCLAW_GATEWAY_TOKEN }}

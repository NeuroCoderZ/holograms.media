name: 🧪 Deploy Backend to Koyeb (Development)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  deploy_backend_dev:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install and Configure Koyeb CLI
        uses: koyeb-community/install-koyeb-cli@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: 🚀 Deploy and Sync Environment
        run: |
          # Sync secrets to Vault one-by-one (DEV)
          secrets=(
            "DEV_GOOGLE_CLIENT_ID:${{ secrets.DEV_GOOGLE_CLIENT_ID }}"
            "DEV_GOOGLE_CLIENT_SECRET:${{ secrets.DEV_GOOGLE_CLIENT_SECRET }}"
            "ASTRA_DB_APPLICATION_TOKEN:${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}"
            "ASTRA_DB_API_ENDPOINT:${{ secrets.ASTRA_DATABASE_URL }}"
            "GOOGLE_API_KEY:${{ secrets.GOOGLE_API_KEY }}"
            "MISTRAL_API_KEY:${{ secrets.MISTRAL_API_KEY }}"
            # openclaw removed — replaced by Hermes Family (Tria Cortex)
#             "OPENCLAW_GATEWAY_TOKEN:${{ secrets.OPENCLAW_GATEWAY_TOKEN }}"
          )
          for entry in "${secrets[@]}"; do
            name="${entry%%:*}"
            value="${entry#*:}"
            koyeb secret update "$name" --value "$value" > /dev/null 2>&1 || \
              koyeb secret create "$name" --value "$value"
          done

          # Update Development Service
          koyeb service update holograms-media-dev/holograms-media-dev \
            --git-branch dev \
            --git-builder docker \
            --git-docker-dockerfile Dockerfile \
            --env "ENVIRONMENT=development" \
            --env "GOOGLE_CLIENT_ID={{ secret.DEV_GOOGLE_CLIENT_ID }}" \
            --env "GOOGLE_CLIENT_SECRET={{ secret.DEV_GOOGLE_CLIENT_SECRET }}" \
            --env "ASTRA_DB_APPLICATION_TOKEN={{ secret.ASTRA_DB_APPLICATION_TOKEN }}" \
            --env "ASTRA_DB_API_ENDPOINT={{ secret.ASTRA_DB_API_ENDPOINT }}" \
            --env "ASTRA_DATABASE_URL={{ secret.ASTRA_DB_API_ENDPOINT }}" \
            --env "ASTRA_DB_KEYSPACE=default_keyspace" \
            --env "GOOGLE_API_KEY={{ secret.GOOGLE_API_KEY }}" \
            --env "MISTRAL_API_KEY={{ secret.MISTRAL_API_KEY }}"

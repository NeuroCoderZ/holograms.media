name: 🚀 Deploy Backend to Koyeb (Production)

on:
  push:
    branches: [master, main]

jobs:
  deploy_backend_production:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Backend to Koyeb
        uses: koyeb/action-git-deploy@v1
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}
          git_branch: master
          app_name: holograms-media
          service_name: holograms-media
          service_type: web
          service_ports: "8000:http"
          service_routes: "/:8000"
          service_instance_type: free
          git_builder: docker
          git_docker_dockerfile: Dockerfile
          service_env: |
            ENVIRONMENT=production
            CORS_ORIGIN_1=https://holograms.media
            CORS_ORIGIN_2=https://www.holograms.media
            PYTHONUNBUFFERED=1
            PYTHONDONTWRITEBYTECODE=1
            PORT=8000
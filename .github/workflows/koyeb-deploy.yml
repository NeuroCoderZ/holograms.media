name: 🚀 Deploy Backend to Koyeb (Production)

on:
  push:
    branches: [master, main]

jobs:
  deploy_backend_production:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          # Move binary to global path to ensure visibility
          sudo mv $HOME/.koyeb/bin/koyeb /usr/local/bin/koyeb
          koyeb version

      - name: 🚀 Deploy to Koyeb
        run: |
          koyeb service update holograms-media/holograms-media \
            --git github.com/NeuroCoderZ/holograms.media \
            --git-branch master \
            --git-builder docker \
            --docker-dockerfile Dockerfile \
            --env ENVIRONMENT=production \
            --env CORS_ORIGIN_1=https://holograms.media \
            --env CORS_ORIGIN_2=https://www.holograms.media \
            --env PYTHONUNBUFFERED=1 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PORT=8000
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
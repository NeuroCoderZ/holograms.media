name: 🚀 Deploy Backend to Koyeb (Production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy_backend_production:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install and Configure Koyeb CLI
        uses: koyeb-community/install-koyeb-cli@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: 🚀 Deploy and Sync Environment
        run: |
          # Sync secrets to Vault one-by-one (PROD)
          secrets=(
            "PROD_GOOGLE_CLIENT_ID:${{ secrets.PROD_GOOGLE_CLIENT_ID }}"
            "PROD_GOOGLE_CLIENT_SECRET:${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}"
          )
          for entry in "${secrets[@]}"; do
            name="${entry%%:*}"
            value="${entry#*:}"
            koyeb secret update "$name" --value "$value" > /dev/null 2>&1 || \
              koyeb secret create "$name" --value "$value"
          done

          # Update Production Service
          koyeb service update holograms-media-prod/holograms-media-prod \
            --git-branch main \
            --git-builder docker \
            --git-docker-dockerfile Dockerfile \
            --env "ENVIRONMENT=production" \
            --env "GOOGLE_CLIENT_ID={{ secret.PROD_GOOGLE_CLIENT_ID }}" \
            --env "GOOGLE_CLIENT_SECRET={{ secret.PROD_GOOGLE_CLIENT_SECRET }}" \
            --env "ASTRA_DB_APPLICATION_TOKEN={{ secret.ASTRA_DB_APPLICATION_TOKEN }}" \
            --env "ASTRA_DB_API_ENDPOINT={{ secret.ASTRA_DATABASE_URL }}" \
            --env "ASTRA_DATABASE_URL={{ secret.ASTRA_DATABASE_URL }}" \
            --env "ASTRA_DB_KEYSPACE=default_keyspace" \
            --env "GOOGLE_API_KEY={{ secret.GOOGLE_API_KEY }}" \
            --env "MISTRAL_API_KEY={{ secret.MISTRAL_API_KEY }}" \
            # openclaw removed — replaced by Hermes Family (Tria Cortex)
# --env "OPENCLAW_GATEWAY_TOKEN={{ secret.OPENCLAW_GATEWAY_TOKEN }}"

name: 🚀 Deploy Backend to Koyeb (Production)

on:
  push:
    branches: [master, main]

jobs:
  deploy_backend_production:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: 🚀 Deploy Backend to Koyeb
        uses: koyeb/action-git-deploy@v1
        with:
          app-name: holograms-media
          service-name: holograms-media
          service-type: web
          service-ports: "8000:http"
          service-routes: "/:8000"
          service-instance-type: free
          git-builder: docker
          git-docker-dockerfile: Dockerfile
          service-env: |
            ENVIRONMENT=production
            CORS_ORIGIN_1=https://holograms.media
            CORS_ORIGIN_2=https://www.holograms.media
            PYTHONUNBUFFERED=1
            PYTHONDONTWRITEBYTECODE=1
            PORT=8000
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
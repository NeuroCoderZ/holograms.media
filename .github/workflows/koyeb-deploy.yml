name: 🚀 Deploy Backend to Koyeb (Production)

on:
  push:
    branches: [master, main]

jobs:
  deploy_backend_production:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install and Configure Koyeb CLI
        uses: koyeb-community/install-koyeb-cli@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      # НОВЫЙ ШАГ: Удаляем старый сервис, чтобы освободить 512МБ RAM
      - name: 🧹 Cleanup Old Service (Free Tier Workaround)
        run: |
          echo "Checking for existing service to free up quota..."
          koyeb service delete holograms-media/holograms-media --force || echo "Service not found, skipping cleanup."

      - name: 🚀 Deploy Backend to Koyeb
        id: koyeb-deploy
        uses: koyeb/action-git-deploy@v1
        with:
          git-branch: master
          app-name: holograms-media
          service-name: holograms-media
          service-type: web
          service-ports: "8000:http"
          service-routes: "/:8000"
          service-instance-type: free
          service-env: |
            ENVIRONMENT=production
            CORS_ORIGIN_1=https://holograms.media
            CORS_ORIGIN_2=https://www.holograms.media
            PYTHONUNBUFFERED=1
            PYTHONDONTWRITEBYTECODE=1
            PORT=8000

      - name: 📋 Output Backend URL
        run: |
          echo "Backend deployed to: ${{ steps.koyeb-deploy.outputs.app_url }}"
          echo "::notice::Production Backend URL: ${{ steps.koyeb-deploy.outputs.app_url }}"

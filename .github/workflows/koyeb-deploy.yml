# ⚠️ AGENT_ADVISORY: КРИТИЧЕСКАЯ ИНФРАСТРУКТУРА
# Этот файл был восстановлен после серии сбоев, вызванных попытками "оптимизации".
# ПРАВИЛА ДЛЯ АГЕНТОВ:
# 1. НЕ УДАЛЯЙТЕ шаг 'install-koyeb-cli' — это единственный способ авторизации CLI.
# 2. НЕ МЕНЯЙТЕ 'with' параметры на 'snake_case', если они в 'kebab-case'.
# 3. ЛЮБЫЕ правки должны проверяться через 'git diff' с коммитом 2bbaf76.
# 4. Если вы не уверены на 100% — НЕ ТРОГАЙТЕ этот файл.

name: 🚀 Deploy Backend to Koyeb (Production)

on:
  push:
    branches: [master, prod]
  workflow_dispatch: {}

jobs:
  deploy_backend_production:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install and Configure Koyeb CLI
        uses: koyeb-community/install-koyeb-cli@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}


      - name: 🚀 Deploy Backend to Koyeb
        id: koyeb-deploy
        uses: koyeb/action-git-deploy@v1
        with:
          git-branch: ${{ github.ref_name }}
          app-name: holograms-media-prod
          service-name: holograms-media-prod
          service-type: web
          service-ports: "8000:http"
          service-routes: "/:8000"
          service-instance-type: free
          git-builder: docker
          git-docker-dockerfile: Dockerfile
          service-env: |
            ENVIRONMENT=production
            CORS_ORIGIN_1=https://holograms.media
            CORS_ORIGIN_2=https://www.holograms.media
            PYTHONUNBUFFERED=1
            PYTHONDONTWRITEBYTECODE=1
            PORT=8000
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
            ASTRA_DB_APPLICATION_TOKEN=${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
            ASTRA_DB_API_ENDPOINT=${{ secrets.ASTRA_DB_API_ENDPOINT }}
            ASTRA_DB_ID=${{ secrets.ASTRA_DB_ID }}
            ASTRA_DB_REGION=${{ secrets.ASTRA_DB_REGION }}
            B2_ENDPOINT_URL=${{ secrets.B2_ENDPOINT_URL }}
            B2_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}
            B2_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}

      - name: 📋 Output Backend URL
        run: |
          echo "Backend deployed to: ${{ steps.koyeb-deploy.outputs.app_url }}"
          echo "::notice::Production Backend URL: ${{ steps.koyeb-deploy.outputs.app_url }}"

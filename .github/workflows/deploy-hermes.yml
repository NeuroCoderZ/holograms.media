name: 🤖 Deploy Hermes to Cloudflare Workers

on:
  push:
    branches: [dev, main]
    paths:
      - 'neuroescrow/backend/**'
      - '.github/workflows/deploy-hermes.yml'
  workflow_dispatch: {}

jobs:
  deploy_hermes:
    runs-on: ubuntu-latest
    name: Deploy Hermes Worker
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 🔐 Set Cloudflare Secrets
        working-directory: neuroescrow/backend
        run: |
          echo "${{ secrets.MISTRAL_API_KEY }}" | npx wrangler secret put MISTRAL_API_KEY
          echo "${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}" | npx wrangler secret put ASTRA_DB_TOKEN
          echo "${{ secrets.ASTRA_DATABASE_URL }}" | npx wrangler secret put ASTRA_DB_ENDPOINT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'neuroescrow/backend'
          command: deploy
      
      - name: 🧪 Test Deployment
        run: |
          sleep 5
          curl -f https://neuroescrow-hermes.neurocoderz.workers.dev/health || echo "Health check failed"

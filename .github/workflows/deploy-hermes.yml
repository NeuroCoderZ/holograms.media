name: 🤖 Deploy Hermes to Cloudflare Workers

on:
  push:
    branches: [dev, main]
    paths:
      - 'neuroescrow/backend/**'
      - '.github/workflows/deploy-hermes.yml'
  workflow_dispatch: {}

jobs:
  deploy_hermes:
    runs-on: ubuntu-latest
    name: Deploy Hermes Worker
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'neuroescrow/backend'
          command: deploy
          secrets: |
            MISTRAL_API_KEY
            ASTRA_DB_TOKEN
            ASTRA_DB_ENDPOINT
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
          ASTRA_DB_ENDPOINT: ${{ secrets.ASTRA_DATABASE_URL }}
      
      - name: 🧪 Test Deployment
        run: |
          sleep 5
          curl -f https://neuroescrow-hermes.neurocoderz.workers.dev/health || echo "Health check failed"

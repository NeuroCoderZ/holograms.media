name: 🚀 Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

jobs:
  deploy_frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build & Deploy
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: Extract version
        id: version
        run: |
          VERSION=$(cat version.txt | grep -oP '\d+\.\d+\.\d+' || echo "unknown")
          echo "version<<EOF" >> $GITHUB_OUTPUT
          echo "$VERSION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Frontend
        run: npx vite build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ github.ref_name == 'main' && secrets.PROD_GOOGLE_CLIENT_ID || secrets.DEV_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ github.ref_name == 'main' && 'https://holograms-media-prod-holograms-media-6a8cc743.koyeb.app' || 'https://holograms-media-dev-holograms-media-cb8383e3.koyeb.app' }}
          VITE_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}

      - name: 🔧 Copy _headers and _redirects to dist
        run: |
          mkdir -p dist
          cp public/_headers dist/_headers || echo "No _headers found"
          cp public/_redirects dist/_redirects || echo "No _redirects found"

      # 2026-10-02 18:30 MSK — ЭКШЕН ЗАМЕНЁН: cloudflare/pages-action НЕ СУЩЕСТВУЕТ.
      # Проверено через сеть: github.com/cloudflare/pages-action → HTTP 404.
      # Из-за этого ран падал за ~9 секунд на этапе "Prepare all required actions",
      # и фронт не деплоился (та же ошибка была 30.09.2026 на v0.20.612).
      # Замена на официальный cloudflare/wrangler-action (HTTP 200) с
      # pages deploy --project-name. Проект берётся по ветке: main → holograms-media,
      # dev → holograms-media-dev (Cloudflare Pages смотрит только dev).
      #
      # 2026-10-02 19:05 MSK — ИСПРАВЛЕНИЕ МОЕЙ ОШИБКИ. Раньше здесь стояло
      # `--branch=${{ github.ref_name }}`, и это ЛОМАЛО деплой: деплои из dev уходили
      # в окружение preview, алиас https://dev.holograms.media удерживал
      # production-деплой от 25.08.2026, то есть все правки не доезжали до сайта.
      # ВОССТАНОВЛЕНО ИСХОДНОЕ ПОВЕДЕНИЕ из коммита 72c7dd1 (11.03.2026,
      # "fix(ci): route dev deployments as production on cloudflare"):
      # принудительно объявляем ветку main, чтобы dev-деплои становились production.
      # Вся разработка ведётся в dev и проверяется на dev.holograms.media.
      - name: ☁️ Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ github.ref_name == 'main' && 'holograms-media' || 'holograms-media-dev' }} --branch=main
      
      - name: Summary
        run: |
          echo "## ✅ Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

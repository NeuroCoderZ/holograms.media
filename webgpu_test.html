<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU/WebGL Test - Triangle Rendering</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #ccc;
            display: block;
            margin: 20px auto;
        }
        .info {
            text-align: center;
            margin-bottom: 20px;
        }
        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Тест поддержки WebGPU/WebGL</h1>
    <div class="info">
        <p>Этот тест проверяет поддержку WebGPU и WebGL в вашем браузере и рендерит базовый треугольник.</p>
        <p id="support-info">Проверка поддержки...</p>
    </div>
    <canvas id="renderCanvas" width="800" height="600"></canvas>
    <div id="error-message" class="error"></div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const supportInfo = document.getElementById('support-info');
        const errorMessage = document.getElementById('error-message');

        async function init() {
            try {
                // Проверка поддержки WebGPU
                if (navigator.gpu) {
                    supportInfo.textContent = 'WebGPU поддерживается. Используем WebGPU для рендеринга.';
                    await initWebGPU();
                } else if (checkWebGLSupport()) {
                    supportInfo.textContent = 'WebGPU не поддерживается. WebGL поддерживается. Используем WebGL для рендеринга.';
                    initWebGL();
                } else {
                    supportInfo.textContent = 'Ни WebGPU, ни WebGL не поддерживаются.';
                    errorMessage.textContent = 'Ваш браузер не поддерживает WebGPU или WebGL.';
                }
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                errorMessage.textContent = 'Ошибка: ' + error.message;
            }
        }

        function checkWebGLSupport() {
            try {
                return !!(window.WebGLRenderingContext && canvas.getContext('webgl'));
            } catch (e) {
                return false;
            }
        }

        async function initWebGPU() {
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                throw new Error('Не удалось получить GPU адаптер');
            }

            const device = await adapter.requestDevice();

            const context = canvas.getContext('webgpu');
            const format = navigator.gpu.getPreferredCanvasFormat();

            context.configure({
                device: device,
                format: format,
                alphaMode: 'opaque',
            });

            // Вершины треугольника
            const vertices = new Float32Array([
                0.0,  0.5, 0.0,  // верхняя вершина
               -0.5, -0.5, 0.0,  // левая нижняя
                0.5, -0.5, 0.0,  // правая нижняя
            ]);

            const vertexBuffer = device.createBuffer({
                size: vertices.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(vertexBuffer, 0, vertices);

            // WGSL шейдеры
            const vertexShaderCode = `
                @vertex
                fn main(@location(0) position: vec3<f32>) -> @builtin(position) vec4<f32> {
                    return vec4<f32>(position, 1.0);
                }
            `;

            const fragmentShaderCode = `
                @fragment
                fn main() -> @location(0) vec4<f32> {
                    return vec4<f32>(0.0, 0.5, 1.0, 1.0); // Синий цвет
                }
            `;

            const vertexModule = device.createShaderModule({ code: vertexShaderCode });
            const fragmentModule = device.createShaderModule({ code: fragmentShaderCode });

            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: vertexModule,
                    entryPoint: 'main',
                    buffers: [{
                        arrayStride: 3 * 4, // 3 floats * 4 bytes
                        attributes: [{
                            shaderLocation: 0,
                            offset: 0,
                            format: 'float32x3',
                        }],
                    }],
                },
                fragment: {
                    module: fragmentModule,
                    entryPoint: 'main',
                    targets: [{ format: format }],
                },
                primitive: {
                    topology: 'triangle-list',
                },
            });

            function render() {
                const commandEncoder = device.createCommandEncoder();
                const textureView = context.getCurrentTexture().createView();

                const renderPass = commandEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store',
                    }],
                });

                renderPass.setPipeline(pipeline);
                renderPass.setVertexBuffer(0, vertexBuffer);
                renderPass.draw(3);
                renderPass.end();

                device.queue.submit([commandEncoder.finish()]);
                requestAnimationFrame(render);
            }

            render();
        }

        function initWebGL() {
            const gl = canvas.getContext('webgl');
            if (!gl) {
                throw new Error('Не удалось получить WebGL контекст');
            }

            // Вершины треугольника
            const vertices = [
                0.0,  0.5, 0.0,
               -0.5, -0.5, 0.0,
                0.5, -0.5, 0.0,
            ];

            const vertexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

            // Вершинный шейдер
            const vertexShaderSource = `
                attribute vec3 aPosition;
                void main() {
                    gl_Position = vec4(aPosition, 1.0);
                }
            `;

            // Фрагментный шейдер
            const fragmentShaderSource = `
                void main() {
                    gl_FragColor = vec4(0.0, 0.5, 1.0, 1.0); // Синий цвет
                }
            `;

            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, vertexShaderSource);
            gl.compileShader(vertexShader);

            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, fragmentShaderSource);
            gl.compileShader(fragmentShader);

            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            gl.useProgram(program);

            const positionAttributeLocation = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(positionAttributeLocation);
            gl.vertexAttribPointer(positionAttributeLocation, 3, gl.FLOAT, false, 0, 0);

            function render() {
                gl.clearColor(0.0, 0.0, 0.0, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                requestAnimationFrame(render);
            }

            render();
        }

        init();
    </script>
</body>
</html>

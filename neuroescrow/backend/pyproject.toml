[project]
name = "neuroescrow-hermes"
version = "1.0.0"
description = "Hermes - Intelligent Agent for NeuroEscrow with RAG and Multimodal Support"
requires-python = ">=3.11"

dependencies = [
    "astrapy>=2.0.0",
    "mistralai>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

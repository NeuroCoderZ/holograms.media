name = "neuroescrow-hermes"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
MODEL_NAME = "mistral-medium-3.5"
EMBEDDING_MODEL = "codestral-embed-2505"
EMBEDDING_DIMENSION = 1536

# Объявление обязательных секретов (новый синтаксис 2026)
[secrets]
required = ["MISTRAL_API_KEY", "ASTRA_DB_TOKEN", "ASTRA_DB_ENDPOINT"]

# KV for embedding cache
[[kv_namespaces]]
binding = "CACHE"
id = "367aa39f2c134d6b882653d4b9228132"

# Secrets (set via: wrangler secret put SECRET_NAME)
# MISTRAL_API_KEY - Mistral API key for Medium 3.5 + embeddings
# ASTRA_DB_TOKEN - AstraDB application token
# ASTRA_DB_ENDPOINT - AstraDB API endpoint
# TELEGRAM_BOT_TOKEN - Telegram bot token

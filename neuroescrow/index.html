<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NeuroEscrow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Telegram Mini App SDK Initialization (Phase 6.5) -->
    <script>
        // Initialize Telegram WebApp SDK (v9.x)
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            
            // Expand viewport to full height
            tg.expand();
            
            // Enable closing confirmation
            tg.enableClosingConfirmation();
            
            // Apply theme colors
            document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
            document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
            document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
            document.documentElement.style.setProperty('--tg-theme-link-color', tg.themeParams.link_color || '#2481cc');
            document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#2481cc');
            document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
            
            // Signal ready state
            tg.ready();
            
            console.log('[TG WebApp] Initialized', {
                version: tg.version,
                platform: tg.platform,
                colorScheme: tg.colorScheme,
                viewportHeight: tg.viewportHeight,
                isExpanded: tg.isExpanded
            });
        } else {
            console.warn('[TG WebApp] SDK not loaded, running in standalone mode');
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1>NeuroEscrow</h1>
                <div class="user-info">
                    <span id="user-name">Загрузка...</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main" id="main-content">
            <!-- Views will be rendered here -->
        </main>

        <!-- Chat Input (Fixed at bottom, only visible on Hermes tab) -->
        <div class="chat-input-container" id="chat-input-container" style="display:none;">
            <button class="attach-btn" id="attach-btn" onclick="app.showAttachMenu()">
                <span>📎</span>
            </button>
            <input type="text" class="chat-input" id="chat-input" placeholder="Напишите сообщение..." />
            <button class="send-btn" id="send-btn" onclick="app.sendTextMessage()">
                <span>➤</span>
            </button>
        </div>

        <!-- Attach Menu -->
        <div class="attach-menu" id="attach-menu" style="display:none;">
            <button class="attach-option" onclick="app.attachPhoto()">
                <span class="attach-icon">📷</span>
                <span>Фото</span>
            </button>
            <button class="attach-option" onclick="app.attachVideo()">
                <span class="attach-icon">🎥</span>
                <span>Видео</span>
            </button>
            <button class="attach-option" onclick="app.recordVideo()">
                <span class="attach-icon">📹</span>
                <span>Записать видео</span>
            </button>
            <button class="attach-option" onclick="app.shareScreen()">
                <span class="attach-icon">🖥️</span>
                <span>Экран</span>
            </button>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="hermes" onclick="app.navigate('hermes')">
                <span class="nav-icon">🎙️</span>
                <span class="nav-label">Гермес</span>
            </button>
            <button class="nav-btn" data-view="deals" onclick="app.navigate('deals')">
                <span class="nav-icon">🤝</span>
                <span class="nav-label">Сделки</span>
            </button>
            <button class="nav-btn" data-view="profile" onclick="app.navigate('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="js/telegram.js"></script>
    <script src="js/tonconnect.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
